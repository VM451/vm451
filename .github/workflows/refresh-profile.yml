name: Refresh profile

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh_profile.py'
      - '.github/workflows/refresh-profile.yml'

concurrency:
  group: profile-refresh

jobs:
  refresh:
    if: github.repository == 'VM451/vm451' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: Update the profile
        run: python3 .github/scripts/refresh_profile.py
      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs(profile): refresh GitHub activity'
          git push origin HEAD:main
