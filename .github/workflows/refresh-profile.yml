name: Refresh profile

on:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [profile-project-pushed]
  push:
    branches: [main]
    paths:
      - '.github/scripts/*.py'
      - '.github/workflows/refresh-profile.yml'

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'VM451/vm451' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: Test landmark selection
        run: python3 .github/scripts/test_refresh_profile.py
      - name: Update the profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/refresh_profile.py
      - name: Commit changes
        run: |
          git add -- README.md profile/city.svg profile/header.svg profile/landmarks.svg profile/population.svg profile/visit.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(profile): refresh GitHub activity'
          git push origin HEAD:main
